<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist Style Photo</title>
    <style>
      :root {
        --bg: #090b15;
        --panel: #141a2f;
        --text: #eef2ff;
        --muted: #aab3d4;
        --accent: #7c5cff;
        --accent-2: #ff4fa1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top, #1f2a5a 0%, var(--bg) 45%);
        color: var(--text);
        padding: 24px;
      }

      .playlist-card {
        width: min(900px, 100%);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(22, 29, 53, 0.95), rgba(13, 16, 29, 0.95));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.45);
        padding: 26px;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 24px;
      }

      .cover-wrap {
        position: relative;
      }

      .cover-wrap img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 18px;
        display: block;
      }

      .tag {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 999px;
      }

      .playlist-meta h1 {
        margin: 6px 0;
        font-size: clamp(30px, 4vw, 42px);
      }

      .playlist-meta p {
        margin: 0;
        color: var(--muted);
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn.primary {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: #fff;
      }

      .btn.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      ul {
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      li {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 10px 12px;
      }

      li small {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .playlist-card {
          grid-template-columns: 1fr;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <section class="playlist-card" aria-label="Playlist style photo">
      <div class="cover-wrap">
        <img
          src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=900&q=80"
          alt="A playlist style cover photo with studio lights"
        />
        <span class="tag">Featured Mix</span>
      </div>

      <div class="playlist-meta">
        <p>Curated by Ravi</p>
        <h1>Night Drive Playlist</h1>
        <p>Late-night synthwave, chill beats, and neon vibes in one style photo.</p>

        <div class="actions">
          <button class="btn primary">Play Now</button>
          <button class="btn secondary">Save</button>
        </div>

        <ul>
          <li><strong>1</strong><span>Midnight Highway</span><small>3:42</small></li>
          <li><strong>2</strong><span>Electric Sky</span><small>4:05</small></li>
          <li><strong>3</strong><span>Retro Pulse</span><small>2:59</small></li>
          <li><strong>4</strong><span>Neon Reflection</span><small>3:16</small></li>
          <li><strong>5</strong><span>City Lights Fade</span><small>4:11</small></li>
        </ul>
      </div>
    </section>
  </body>
</html>
